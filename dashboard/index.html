  <style>
    :root{
      --navy:#10172d;--navy-2:#18213d;--navy-3:#232d4d;--yellow:#ffd600;
      --green:#91bd50;--green-dark:#42672f;--cream:#f5f1e7;--paper:#fffdf8;

      --shadow:0 24px 70px -48px rgba(16,23,45,.5);--r:24px;

    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px}
    button,input,select{font:inherit} button{cursor:pointer} a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid rgba(255,214,0,.6);outline-offset:3px}
    .app{min-height:100vh;display:grid;grid-template-columns:258px minmax(0,1fr)}
    .sidebar{position:fixed;inset:0 auto 0 0;width:258px;background:var(--navy);color:#fff;padding:28px 20px 22px;display:flex;flex-direction:column;z-index:20;overflow:auto}
    .brand{display:flex;align-items:center;gap:12px;padding:0 8px 30px}.brand img{width:118px;height:auto}.brand small{display:block;color:rgba(255,255,255,.52);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}

    .nav button:hover{color:#fff;background:rgba(255,255,255,.06)}.nav button.active{background:var(--yellow);color:var(--navy)}
    .nav svg{width:18px;height:18px;flex:0 0 auto}.nav .count{margin-left:auto;min-width:20px;height:20px;border-radius:20px;display:grid;place-items:center;background:var(--danger);color:#fff;font-size:11px;padding:0 6px}.nav button.active .count{background:var(--navy);color:#fff}

    .top-title{font-family:var(--head);font-size:14px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.top-source{margin-left:12px;font-size:12px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
    .select,.ghost-btn,.primary-btn{height:42px;border-radius:999px;border:1px solid rgba(23,32,55,.14);padding:0 16px;background:rgba(255,255,255,.6);color:var(--ink);font-weight:700;font-size:13px}.primary-btn{border-color:var(--navy);background:var(--navy);color:#fff}.primary-btn:hover{background:var(--navy-3)}

    .grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.72fr);gap:14px;margin-bottom:14px}.card{background:var(--paper);border:1px solid rgba(23,32,55,.08);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}.card-dark{background:var(--navy);color:#fff;border-color:transparent}.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.card-head h2{font-family:var(--head);font-size:16px;margin:0}.card-head small{font-size:12px;color:var(--muted)}.card-dark .card-head small{color:rgba(255,255,255,.5)}

    .chart svg{position:absolute;inset:0 0 25px;width:100%;height:calc(100% - 25px);overflow:visible}.chart-labels{position:absolute;left:0;right:0;bottom:0;height:18px;display:flex;justify-content:space-between;color:#929289;font-size:11px}.chart-chip{position:absolute;right:12%;top:24%;background:var(--navy);color:#fff;border-radius:10px;padding:7px 9px;font-size:11px;box-shadow:0 8px 22px rgba(16,23,45,.2)}
    .score-area{display:grid;place-items:center;padding:4px 0 12px}.score-ring{width:152px;height:152px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 94%,rgba(255,255,255,.09) 94% 100%);position:relative}.score-ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--navy)}.score-ring div{position:relative;z-index:1;text-align:center}.score-ring strong{font-family:var(--head);font-size:42px;letter-spacing:-.05em}.score-ring span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5)}
    .platforms{display:grid;gap:10px}.platform{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}.platform-logo{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:10px;font-weight:900}.platform strong{font-size:13px}.platform small{display:block;color:rgba(255,255,255,.45);margin-top:2px}.state{font-size:11px;color:var(--green);font-weight:900}.state.warn{color:var(--yellow)}

    .product-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.product-card{background:var(--paper);border:1px solid rgba(23,32,55,.08);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.product-media{height:230px;background:linear-gradient(145deg,#e8eddc,#f9f3e5);display:grid;place-items:center;position:relative;overflow:hidden}.product-media img{width:76%;height:84%;object-fit:contain;filter:drop-shadow(0 18px 16px rgba(23,32,55,.18))}.source-tag{position:absolute;z-index:1;top:13px;left:13px;padding:6px 8px;border-radius:99px;background:rgba(255,255,255,.8);font-size:10px;font-weight:900}.product-copy{padding:16px}.product-copy h3{font-family:var(--head);font-size:15px;margin:0 0 6px}.product-copy p{font-size:12px;color:var(--muted);margin:0 0 14px;min-height:38px;line-height:1.45}.product-meta{display:flex;align-items:end;justify-content:space-between}.product-meta strong{font-size:18px}.product-meta span{font-size:11px;color:var(--muted)}
    .integration-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.integration{border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px}.integration .logo{width:42px;height:42px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--head);font-weight:900}.integration strong{font-size:14px}.integration p{margin:3px 0 0;font-size:11px;color:var(--muted)}
    .switch{width:40px;height:23px;border-radius:20px;background:var(--green);position:relative}.switch::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;right:3px;top:3px}
    .empty-view{text-align:center;padding:80px}.empty-view h2{font-family:var(--head);font-size:34px}.empty-view p{color:var(--muted)}

</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div><img src="assets/main-logo.webp" alt="MYALCHE"><small>Control Center</small></div></div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" aria-label="Primary navigation">
        <button data-view="overview" class="active"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9Zm10 7h6V11h-6v9ZM4 20h6v-3H4v3Zm10-13h6V4h-6v3Z" stroke="currentColor" stroke-width="1.8"/></svg>Overview</button>
        <button data-view="sales"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Sales</button>
        <button data-view="marketing"><svg viewBox="0 0 24 24" fill="none"><path d="M4 14v5m0-5 13-6v-3m-13 9h4l2 6H7l-3-6Zm13-6v10l-9-4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Marketing</button>
        <button data-view="journey"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16l-3 5H7L4 5Zm3 7h10l-3 4h-4l-3-4Zm3 6h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Customer journey</button>
        <button data-view="tracking"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v4m0 10v4m9-9h-4M7 12H3m15.4-6.4-2.8 2.8m-7.2 7.2-2.8 2.8m12.8 0-2.8-2.8M8.4 8.4 5.6 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/></svg>Tracking health</button>
        <button data-view="products"><svg viewBox="0 0 24 24" fill="none"><path d="m4 7 8-4 8 4-8 4-8-4Zm0 0v10l8 4 8-4V7m-8 4v10" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Products</button>
        <button data-view="alerts"><svg viewBox="0 0 24 24" fill="none"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Alerts <span class="count" id="alertCount">3</span></button>
        <button data-view="integrations"><svg viewBox="0 0 24 24" fill="none"><path d="M8 8V4m8 4V4m-9 7h10v3a5 5 0 0 1-10 0v-3Zm5 8v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Integrations</button>
      </nav>
      <div class="side-health"><div class="health-head"><span>Tracking health</span><strong>94</strong></div><div class="health-bar"><i></i></div><p>All core destinations are receiving events. One mismatch needs review.</p></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-title"><span id="topTitle">Overview</span><span class="top-source">Catalog source: myalche.com</span></div>
        <div class="top-actions">
          <select class="select" id="periodSelect" aria-label="Reporting period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
          <button class="primary-btn" id="exportBtn">Export report</button>
          <button class="profile" aria-label="Account menu">MY</button>
        </div>
      </header>
      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </div>

  <div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-backdrop" data-close-drawer></div><aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><button class="drawer-close" data-close-drawer aria-label="Close">×</button><div id="drawerContent"></div></aside></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const products=[
      {name:'Soursop Bitter Cleanser | 16 oz.',short:'Soursop Bitter Cleanser',desc:'Blood Purifier',price:54.99,image:'assets/products/soursop-bitter-cleanser.webp',orders:286,revenue:15727,trend:18},
      {name:'Parasite Cleanse | 16 oz.',short:'Parasite Cleanse',desc:'Eliminate Parasites + Harmful Organisms',price:54.99,image:'assets/products/parasite-cleanse.webp',orders:249,revenue:13692,trend:12},
      {name:'Blood Pressure Cleanser | 16 oz.',short:'Blood Pressure Cleanser',desc:'Support Healthy Arteries and Blood Flow',price:52.99,image:'assets/products/blood-pressure-cleanser.webp',orders:194,revenue:10280,trend:7},
      {name:'Fibroid Cleanser | 16 oz.',short:'Fibroid Cleanser',desc:'Herbal Detox Blend for Fibroids, Cysts and Inflammation',price:54.99,image:'assets/products/fibroid-cleanser.webp',orders:181,revenue:9953,trend:21},
      {name:'Immunity Support Plus | 16 oz.',short:'Immunity Support Plus',desc:'Strengthen Immune Defense',price:42.99,image:'assets/products/immunity-support-plus.webp',orders:152,revenue:6534,trend:4},
      {name:'Anxiety Brain Cleanser | 16 oz.',short:'Anxiety Brain Cleanser',desc:'Herbal Reset for Anxiety, Focus and Clarity',price:50.99,image:'assets/products/anxiety-brain-cleanser.webp',orders:126,revenue:6425,trend:-3}
    ];
    const issueData={
      mismatch:{title:'Meta purchase mismatch',summary:'Meta received fewer purchase events than WooCommerce recorded during the selected period.',facts:[['WooCommerce purchases','1,284'],['Meta purchase events','1,115'],['Difference','169 events · 13.2%'],['First detected','Today, 9:40 AM']],recommendation:'Check purchase-event deduplication and verify that browser and server events share the same event ID before changing campaign reporting.'},
      values:{title:'Purchase value variance',summary:'A small group of GA4 purchase events has a different revenue value from the corresponding store order.',facts:[['Affected orders','18'],['Estimated variance','$486.20'],['Destination','Google Analytics 4'],['Status','Needs review']],recommendation:'Compare tax, shipping and discount mapping between WooCommerce and the GA4 server tag.'},
      healthy:{title:'Google Ads delivery is healthy',summary:'Google Ads is accepting conversion events with a stable success rate.',facts:[['Success rate','99.8%'],['Conversions sent','1,208'],['Failed requests','2'],['Last checked','2 minutes ago']],recommendation:'No action is required. Continue monitoring the purchase and begin-checkout events.'}
    };
    const periodData={7:{revenue:'$21,840',orders:'342',aov:'$63.86',conversion:'3.72%'},30:{revenue:'$82,460',orders:'1,284',aov:'$64.22',conversion:'3.84%'},90:{revenue:'$238,190',orders:'3,702',aov:'$64.34',conversion:'3.91%'}};
    let currentPeriod='30';

    const metricCards=()=>{const d=periodData[currentPeriod];return `<section class="metrics"><article class="metric" style="--wash:#fff0a8"><div class="metric-label">Gross revenue</div><strong>${d.revenue}</strong><div class="metric-foot"><span class="up">↑ 12.4%</span><span>vs previous period</span><i class="tiny-preview">Preview</i></div></article><article class="metric" style="--wash:#e6efd7"><div class="metric-label">Orders</div><strong>${d.orders}</strong><div class="metric-foot"><span class="up">↑ 8.7%</span><span>completed</span><i class="tiny-preview">Preview</i></div></article><article class="metric" style="--wash:#dfe8f0"><div class="metric-label">Average order</div><strong>${d.aov}</strong><div class="metric-foot"><span class="up">↑ 3.2%</span><span>per checkout</span><i class="tiny-preview">Preview</i></div></article><article class="metric" style="--wash:#f3ddd7"><div class="metric-label">Conversion rate</div><strong>${d.conversion}</strong><div class="metric-foot"><span class="down">↓ 0.18%</span><span>needs attention</span><i class="tiny-preview">Preview</i></div></article></section>`};
    const head=(kicker,title,copy)=>`<header class="page-head"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1></div><div><p>${copy}</p><span class="preview-note" style="margin-top:14px"><i></i>Private metrics use preview data</span></div></header>`;
    const productRows=(limit=4)=>`<div class="product-list"><div class="product-row head"><span></span><span>Product</span><span class="num">Orders</span><span class="num">Revenue</span><span class="num">Momentum</span></div>${products.slice(0,limit).map(p=>`<div class="product-row"><img class="prod-img" src="${p.image}" alt=""><div class="prod-name">${p.short}<small>${p.desc}</small></div><div class="num">${p.orders}</div><div class="num">$${p.revenue.toLocaleString()}</div><div class="num"><span class="${p.trend>=0?'up':'down'}">${p.trend>=0?'↑':'↓'} ${Math.abs(p.trend)}%</span><div class="bar-mini"><i style="width:${Math.max(18,Math.abs(p.trend)*4)}%"></i></div></div></div>`).join('')}</div>`;
    const issues=()=>`<div class="issues"><div class="issue" data-issue="mismatch"><i class="issue-dot"></i><div><strong>Meta purchase mismatch</strong><p>169 store purchases are not reflected in Meta.</p></div><button data-inspect="mismatch">Inspect</button></div><div class="issue" data-issue="values"><i class="issue-dot yellow"></i><div><strong>Purchase value variance</strong><p>18 GA4 events differ from store order values.</p></div><button data-inspect="values">Inspect</button></div><div class="issue" data-issue="healthy"><i class="issue-dot green"></i><div><strong>Google Ads is healthy</strong><p>99.8% destination success rate.</p></div><button data-inspect="healthy">View</button></div></div>`;
    const chart=`<div class="chart-wrap"><div class="chart-y"><span>$4k</span><span>$3k</span><span>$2k</span><span>$1k</span><span>$0</span></div><div class="chart"><div class="chart-grid"></div><svg viewBox="0 0 740 240" preserveAspectRatio="none" aria-label="Preview revenue trend"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#91bd50" stop-opacity=".34"/><stop offset="1" stop-color="#91bd50" stop-opacity="0"/></linearGradient></defs><path d="M0 198 C50 183 55 148 105 157 S175 205 218 168 S277 98 329 126 S404 180 451 118 S520 52 572 89 S640 146 690 74 S720 53 740 36 L740 240 L0 240Z" fill="url(#area)"/><path d="M0 198 C50 183 55 148 105 157 S175 205 218 168 S277 98 329 126 S404 180 451 118 S520 52 572 89 S640 146 690 74 S720 53 740 36" fill="none" stroke="#42672f" stroke-width="4" stroke-linecap="round"/><circle cx="690" cy="74" r="6" fill="#ffd600" stroke="#10172d" stroke-width="3"/></svg><div class="chart-chip">Peak · $4,120</div><div class="chart-labels"><span>Sep 07</span><span>Sep 12</span><span>Sep 17</span><span>Sep 22</span><span>Sep 27</span><span>Oct 06</span></div></div></div>`;

    const views={
      overview:()=>`${head('MYALCHE Intelligence','Business in <em>balance.</em>','One workspace for store performance, advertising and tracking health. Catalog information is sourced from the live MYALCHE store.')}<div class="alert-strip"><div class="alert-icon">!</div><div><strong>One issue can affect campaign reporting.</strong><span>Meta is missing 13.2% of recorded purchases.</span></div><button data-inspect="mismatch">Review issue</button></div>${metricCards()}<section class="grid-main"><article class="card"><div class="card-head"><div><h2>Revenue rhythm</h2><small>Preview performance across the selected period</small></div><span class="pill">+12.4%</span></div>${chart}</article><article class="card card-dark"><div class="card-head"><div><h2>Tracking health</h2><small>Destination delivery</small></div><span class="state">LIVE</span></div><div class="score-area"><div class="score-ring"><div><strong>94</strong><span>Healthy</span></div></div></div><div class="platforms"><div class="platform"><b class="platform-logo">W</b><div><strong>WooCommerce</strong><small>Store source</small></div><span class="state">100%</span></div><div class="platform"><b class="platform-logo">M</b><div><strong>Meta</strong><small>Purchase mismatch</small></div><span class="state warn">86.8%</span></div><div class="platform"><b class="platform-logo">G</b><div><strong>Google</strong><small>Events delivered</small></div><span class="state">99.8%</span></div></div></article></section><section class="grid-bottom"><article class="card"><div class="card-head"><div><h2>Products moving the business</h2><small>Real MYALCHE catalog · preview performance</small></div><button class="ghost-btn" data-view="products">View catalog</button></div>${productRows()}</article><article class="card"><div class="card-head"><div><h2>Needs attention</h2><small>Prioritized by business impact</small></div></div>${issues()}</article></section>`,
      sales:()=>`${head('Sales intelligence','Know what is <em>selling.</em>','Store-level revenue, order quality and product momentum in one clear view.')} ${metricCards()}<section class="section-grid"><article class="card span-8"><div class="card-head"><div><h2>Revenue performance</h2><small>Preview model</small></div><span class="pill">Growing</span></div>${chart}</article><article class="card span-4"><div class="card-head"><h2>Order quality</h2></div><div class="stat-list"><div class="stat-line"><div><strong>Completed orders</strong><p>94.7% of placed orders</p></div><b>1,216</b></div><div class="stat-line"><div><strong>Refunded orders</strong><p>2.1% refund rate</p></div><b>27</b></div><div class="stat-line"><div><strong>Repeat customers</strong><p>Returning within 90 days</p></div><b>31.8%</b></div><div class="stat-line"><div><strong>Discount impact</strong><p>Revenue after discounts</p></div><b>$3,460</b></div></div></article><article class="card span-12"><div class="card-head"><div><h2>Product contribution</h2><small>Catalog details are sourced from MYALCHE</small></div></div>${productRows(6)}</article></section>`,
      marketing:()=>`${head('Marketing intelligence','Spend with <em>clarity.</em>','Compare every paid channel against the same store revenue instead of relying on isolated platform reporting.')}<section class="metrics"><article class="metric"><div class="metric-label">Ad spend</div><strong>$21,680</strong><div class="metric-foot"><span>All channels</span><i class="tiny-preview">Preview</i></div></article><article class="metric"><div class="metric-label">Attributed revenue</div><strong>$68,920</strong><div class="metric-foot"><span class="up">↑ 15.2%</span><i class="tiny-preview">Preview</i></div></article><article class="metric"><div class="metric-label">Blended ROAS</div><strong>3.18×</strong><div class="metric-foot"><span class="up">↑ 0.24</span><i class="tiny-preview">Preview</i></div></article><article class="metric"><div class="metric-label">Customer acquisition</div><strong>$24.60</strong><div class="metric-foot"><span class="down">↑ $1.30</span><i class="tiny-preview">Preview</i></div></article></section><section class="section-grid"><article class="card span-8"><div class="card-head"><div><h2>Channel performance</h2><small>Preview platform data</small></div></div><div class="channel-grid"><div class="channel"><div class="channel-top"><b class="channel-mark">M</b><span class="pill warn">Review</span></div><h3>Meta Ads</h3><dl><div><dt>Spend</dt><dd>$12,460</dd></div><div><dt>Revenue</dt><dd>$38,940</dd></div><div><dt>ROAS</dt><dd class="roas">3.13×</dd></div><div><dt>CAC</dt><dd>$26.10</dd></div></dl></div><div class="channel"><div class="channel-top"><b class="channel-mark">G</b><span class="pill">Healthy</span></div><h3>Google Ads</h3><dl><div><dt>Spend</dt><dd>$6,820</dd></div><div><dt>Revenue</dt><dd>$23,380</dd></div><div><dt>ROAS</dt><dd class="roas">3.43×</dd></div><div><dt>CAC</dt><dd>$22.40</dd></div></dl></div><div class="channel"><div class="channel-top"><b class="channel-mark">T</b><span class="pill">Healthy</span></div><h3>TikTok</h3><dl><div><dt>Spend</dt><dd>$2,400</dd></div><div><dt>Revenue</dt><dd>$6,600</dd></div><div><dt>ROAS</dt><dd class="roas">2.75×</dd></div><div><dt>CAC</dt><dd>$28.80</dd></div></dl></div></div></article><article class="card span-4"><div class="card-head"><h2>Decision support</h2></div><div class="stat-list"><div class="stat-line"><div><strong>Scale Google Search</strong><p>Best ROAS and lowest acquisition cost.</p></div><span class="pill">Opportunity</span></div><div class="stat-line"><div><strong>Review Meta reporting</strong><p>Purchase events are below store totals.</p></div><span class="pill warn">Check</span></div><div class="stat-line"><div><strong>Protect Fibroid demand</strong><p>Highest product growth this period.</p></div><span class="pill">+21%</span></div></div></article></section>`,
      journey:()=>`${head('Customer journey','See where intent <em>becomes revenue.</em>','A single funnel connects customer behavior to completed WooCommerce orders.')}<section class="section-grid"><article class="card span-8"><div class="card-head"><div><h2>Commerce funnel</h2><small>Preview journey data</small></div><span class="pill">3.84% converted</span></div><div class="funnel"><div class="funnel-row"><span>Product views</span><div class="funnel-track"><div class="funnel-fill" style="width:100%">33,438 visitors</div></div><b>100%</b></div><div class="funnel-row"><span>Add to cart</span><div class="funnel-track"><div class="funnel-fill" style="width:38%">5,920</div></div><b>17.7%</b></div><div class="funnel-row"><span>Checkout</span><div class="funnel-track"><div class="funnel-fill" style="width:25%">3,108</div></div><b>9.3%</b></div><div class="funnel-row"><span>Purchase</span><div class="funnel-track"><div class="funnel-fill" style="width:16%">1,284</div></div><b>3.84%</b></div></div></article><article class="card span-4"><div class="card-head"><h2>Largest opportunity</h2></div><p style="font-family:var(--head);font-size:27px;line-height:1.15;margin:10px 0">Recover more customers between cart and checkout.</p><p style="color:var(--muted);line-height:1.6">2,812 visitors added a product but did not begin checkout. A targeted recovery sequence could make this segment visible and actionable.</p><span class="pill warn">47.5% drop-off</span></article><article class="card span-12"><div class="card-head"><div><h2>Journey by featured product</h2><small>Real catalog · preview behavior</small></div></div>${productRows(6)}</article></section>`,
      tracking:()=>`${head('Tracking health','Trust every <em>decision.</em>','Translate technical event delivery into clear business impact and practical next steps.')}<div class="alert-strip"><div class="alert-icon">!</div><div><strong>Meta reporting needs review.</strong><span>169 purchases are missing from the destination total.</span></div><button data-inspect="mismatch">See diagnosis</button></div><section class="section-grid"><article class="card card-dark span-4"><div class="card-head"><div><h2>Overall health</h2><small>Preview diagnostic</small></div><span class="state">LIVE</span></div><div class="score-area"><div class="score-ring"><div><strong>94</strong><span>Healthy</span></div></div></div><p style="text-align:center;color:rgba(255,255,255,.55);font-size:13px">Core tracking is working. One destination mismatch can affect campaign attribution.</p></article><article class="card span-8 compare"><div class="card-head"><div><h2>Platform reconciliation</h2><small>One store truth, compared everywhere</small></div></div><table><thead><tr><th>Source</th><th>Purchase events</th><th>Revenue</th><th>Match to store</th><th>Status</th></tr></thead><tbody><tr><td><strong>WooCommerce</strong></td><td>1,284</td><td>$82,460</td><td>Source of truth</td><td><span class="pill">Healthy</span></td></tr><tr><td><strong>GA4</strong></td><td>1,209</td><td>$79,814</td><td>94.2%</td><td><span class="pill warn">Review values</span></td></tr><tr><td><strong>Meta</strong></td><td>1,115</td><td>$72,906</td><td>86.8%</td><td><span class="pill bad">Mismatch</span></td></tr><tr><td><strong>Google Ads</strong></td><td>1,208</td><td>$79,655</td><td>94.1%</td><td><span class="pill">Healthy</span></td></tr></tbody></table></article><article class="card span-7"><div class="card-head"><h2>What needs attention</h2></div>${issues()}</article><article class="card span-5"><div class="card-head"><h2>Delivery quality</h2></div><div class="stat-list"><div class="stat-line"><div><strong>Server event success</strong><p>Across all destinations</p></div><b>98.7%</b></div><div class="stat-line"><div><strong>Duplicate events</strong><p>Purchase events requiring review</p></div><b>7</b></div><div class="stat-line"><div><strong>Missing event IDs</strong><p>Prevents safe deduplication</p></div><b>34</b></div><div class="stat-line"><div><strong>Last data received</strong><p>WooCommerce purchase</p></div><b>2m</b></div></div></article></section>`,
      products:()=>`${head('Product intelligence','The catalog, made <em>actionable.</em>','Names, descriptions, prices and imagery come from the live MYALCHE catalog. Performance values remain preview data.')}<div class="toolbar"><input class="search" id="productSearch" placeholder="Search MYALCHE products…" aria-label="Search products"><span class="preview-note"><i></i>Live catalog details</span></div><div class="product-cards" id="productCards">${productCards(products)}</div>`,
      alerts:()=>`${head('Alerts center','Problems, made <em>clear.</em>','Prioritized business alerts replace raw technical logs with impact, context and a recommended response.')}<section class="section-grid"><article class="card span-7"><div class="card-head"><div><h2>Active and recent alerts</h2><small>3 items</small></div></div>${issues()}</article><article class="card span-5"><div class="card-head"><h2>Notification rules</h2></div><div class="stat-list"><div class="stat-line"><div><strong>Purchase event stopped</strong><p>Alert if no purchase is received for 6 hours.</p></div><span class="pill">On</span></div><div class="stat-line"><div><strong>Platform mismatch</strong><p>Alert when destination differs by more than 5%.</p></div><span class="pill">On</span></div><div class="stat-line"><div><strong>Revenue value mismatch</strong><p>Alert when order value differs by more than $5.</p></div><span class="pill">On</span></div><div class="stat-line"><div><strong>Weekly executive summary</strong><p>Every Monday at 8:00 AM.</p></div><span class="pill">On</span></div></div></article></section>`,
      integrations:()=>`${head('Connected systems','One view across <em>every source.</em>','The production application will connect securely to the tools MYALCHE already uses. Connection states shown here are preview states.')}<section class="section-grid"><article class="card span-8"><div class="card-head"><div><h2>Data connections</h2><small>Preview connection states</small></div></div><div class="integration-list"><div class="integration"><b class="logo">W</b><div><strong>WooCommerce</strong><p>Orders, products, refunds and customers</p></div><i class="switch"></i></div><div class="integration"><b class="logo">S</b><div><strong>Stape</strong><p>Server events, request health and logs</p></div><i class="switch"></i></div><div class="integration"><b class="logo">G</b><div><strong>Google Analytics 4</strong><p>Sessions, events and journeys</p></div><i class="switch"></i></div><div class="integration"><b class="logo">M</b><div><strong>Meta</strong><p>Campaign spend, conversions and CAPI</p></div><i class="switch"></i></div><div class="integration"><b class="logo">A</b><div><strong>Google Ads</strong><p>Campaign cost and attributed revenue</p></div><i class="switch"></i></div><div class="integration"><b class="logo">T</b><div><strong>TikTok</strong><p>Campaign and event performance</p></div><i class="switch"></i></div></div></article><article class="card span-4"><div class="card-head"><h2>Ownership model</h2></div><p style="font-family:var(--head);font-size:25px;line-height:1.2;margin:10px 0 18px">MYALCHE controls the application and its reporting history.</p><div class="stat-list"><div class="stat-line"><div><strong>Unified permissions</strong><p>One access layer for the team.</p></div><span class="pill">Included</span></div><div class="stat-line"><div><strong>Historical reporting</strong><p>Retain the periods the business needs.</p></div><span class="pill">Owned</span></div><div class="stat-line"><div><strong>Custom metrics</strong><p>Designed around MYALCHE decisions.</p></div><span class="pill">Flexible</span></div></div></article></section>`
    };

    function productCards(list){return list.map(p=>`<article class="product-card"><div class="product-media"><span class="source-tag">MYALCHE catalog</span><img src="${p.image}" alt="${p.short}"></div><div class="product-copy"><h3>${p.name}</h3><p>${p.desc}</p><div class="product-meta"><strong>$${p.price.toFixed(2)}</strong><span>${p.orders} preview orders</span></div></div></article>`).join('')||`<div class="empty-view"><h2>No products found</h2><p>Try a different product name.</p></div>`}
    function render(view){if(!views[view])view='overview';document.getElementById('content').innerHTML=views[view]();document.getElementById('topTitle').textContent=view.replace(/\b\w/g,c=>c.toUpperCase());document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));window.scrollTo({top:0,behavior:'smooth'});bindView();}
    function bindView(){const search=document.getElementById('productSearch');if(search)search.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.getElementById('productCards').innerHTML=productCards(products.filter(p=>(p.name+' '+p.desc).toLowerCase().includes(q)));});}
    function openIssue(key){const d=issueData[key];if(!d)return;document.getElementById('drawerContent').innerHTML=`<p class="eyebrow">Diagnostic detail</p><h2 id="drawerTitle">${d.title}</h2><p>${d.summary}</p><div class="detail-stack">${d.facts.map(f=>`<div class="detail"><span>${f[0]}</span><strong>${f[1]}</strong></div>`).join('')}</div><div class="recommend"><h3>Recommended next step</h3><p>${d.recommendation}</p></div><button class="primary-btn" style="margin-top:20px" data-review="${key}">Mark as reviewed</button>`;const drawer=document.getElementById('drawer');drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');}
    function closeDrawer(){const drawer=document.getElementById('drawer');drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');}
    function showToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
    function exportReport(){const rows=[['MYALCHE Control Center','Preview report'],['Period',document.getElementById('periodSelect').selectedOptions[0].text],['Revenue',periodData[currentPeriod].revenue],['Orders',periodData[currentPeriod].orders],[],['Product','Store price','Preview orders','Preview revenue'],...products.map(p=>[p.name,p.price,p.orders,p.revenue])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='myalche-preview-report.csv';a.click();URL.revokeObjectURL(a.href);showToast('Preview report exported');}
    document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){location.hash=nav.dataset.view;return}const inspect=e.target.closest('[data-inspect]');if(inspect){openIssue(inspect.dataset.inspect);return}if(e.target.closest('[data-close-drawer]')){closeDrawer();return}const review=e.target.closest('[data-review]');if(review){const key=review.dataset.review;document.querySelectorAll(`[data-issue="${key}"]`).forEach(el=>el.classList.add('reviewed'));closeDrawer();showToast('Alert marked as reviewed');}});
    document.getElementById('periodSelect').addEventListener('change',e=>{currentPeriod=e.target.value;render((location.hash||'#overview').slice(1));showToast('Reporting period updated')});
    document.getElementById('exportBtn').addEventListener('click',exportReport);
    window.addEventListener('hashchange',()=>render((location.hash||'#overview').slice(1)));
    window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
    render((location.hash||'#overview').slice(1));
  </script>
</body>
</html>
